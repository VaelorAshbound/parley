<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Parley runs as one Cloudflare Worker. The browser talks to it over HTTPS; server.ts sends /api to Hono and pages to TanStack Start, which calls the same oRPC procedures in-process. Hono streams chat from OpenRouter, writes to Neon Postgres through Hyperdrive, prints PDFs with Browser Run, sends email with Resend, and takes Polar webhooks. A daily cron purges idle guests.">
  <defs><marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6A665D"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743C4"/></marker></defs>
  <style>
    text { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #57544C; }
    .h { font-size: 17px; font-weight: 600; fill: #1B1A17; }
    .t { font-size: 15px; font-weight: 600; fill: #1B1A17; }
    .s { font-size: 13px; white-space: pre; }
    .g { font-size: 13px; font-weight: 600; fill: #1B1A17; }
    .l { font-size: 12px; font-weight: 500; }
  </style>
  <rect width="1200" height="630" fill="#F6F4EE"/>
  <rect x="300" y="20" width="520" height="590" rx="16" fill="#EDEAE2" stroke="#D5CFC2"/>
  <text x="324" y="50" class="h">Cloudflare Worker</text>
  <text x="324" y="70" class="s">one deploy, one set of bindings</text>
  <rect x="320" y="250" width="150" height="92" rx="10" fill="#FFFFFF" stroke="#D5CFC2"/>
  <text x="336" y="276" class="t">server.ts</text>
  <text x="336" y="300" class="s">fetch()</text>
  <text x="336" y="320" class="s">routes by path</text>
  <rect x="560" y="60" width="240" height="340" rx="10" fill="#FFFFFF" stroke="#D5CFC2"/>
  <text x="576" y="86" class="t">Hono  /api/*</text>
  <text x="576" y="110" class="g">Better Auth</text>
  <text x="590" y="130" class="s">guests, email, Google,</text>
  <text x="590" y="150" class="s">GitHub, two-factor</text>
  <text x="576" y="170" class="g">oRPC procedures</text>
  <text x="590" y="190" class="s">chat (streamed)</text>
  <text x="590" y="210" class="s">drafts, export, share</text>
  <text x="590" y="230" class="s">per-user rate limits</text>
  <text x="576" y="250" class="g">Document engine</text>
  <text x="590" y="270" class="s">checks every AI write</text>
  <text x="590" y="290" class="s">renders PDF and DOCX</text>
  <text x="576" y="310" class="g">Polar webhook</text>
  <text x="590" y="330" class="s">sets the Pro plan</text>
  <rect x="560" y="420" width="240" height="82" rx="10" fill="#FFFFFF" stroke="#D5CFC2"/>
  <text x="576" y="446" class="t">TanStack Start SSR</text>
  <text x="576" y="470" class="s">loaders call oRPC</text>
  <text x="576" y="490" class="s">in-process, no HTTP</text>
  <rect x="560" y="522" width="240" height="70" rx="10" fill="#FFFFFF" stroke="#D5CFC2"/>
  <text x="576" y="548" class="t">scheduled()</text>
  <text x="576" y="572" class="s">daily 03:17 UTC</text>
  <text x="324" y="560" class="s">Bindings: Hyperdrive,</text>
  <text x="324" y="579" class="s">Browser Run, Rate Limiting</text>
  <rect x="30" y="201" width="200" height="186" rx="10" fill="#FFFFFF" stroke="#D5CFC2"/>
  <text x="46" y="227" class="t">Browser</text>
  <text x="46" y="251" class="g">React 19</text>
  <text x="60" y="271" class="s">chat</text>
  <text x="60" y="291" class="s">live document</text>
  <text x="46" y="311" class="g">Document engine</text>
  <text x="60" y="331" class="s">same render model</text>
  <text x="60" y="351" class="s">as the PDF</text>
  <rect x="900" y="60" width="270" height="58" rx="10" fill="#FFFFFF" stroke="#D5CFC2"/>
  <text x="916" y="86" class="t">OpenRouter</text>
  <text x="1154" y="86" class="s" text-anchor="end">gpt-6-luna</text>
  <rect x="900" y="132" width="270" height="58" rx="10" fill="#FFFFFF" stroke="#D5CFC2"/>
  <text x="916" y="158" class="t">Browser Run</text>
  <text x="1154" y="158" class="s" text-anchor="end">prints the PDF</text>
  <rect x="900" y="204" width="270" height="58" rx="10" fill="#FFFFFF" stroke="#D5CFC2"/>
  <text x="916" y="230" class="t">Resend</text>
  <text x="1154" y="230" class="s" text-anchor="end">verify, reset email</text>
  <rect x="900" y="276" width="270" height="58" rx="10" fill="#FFFFFF" stroke="#D5CFC2"/>
  <text x="916" y="302" class="t">Polar sandbox</text>
  <text x="1154" y="302" class="s" text-anchor="end">Pro, $5 a month</text>
  <rect x="900" y="348" width="270" height="58" rx="10" fill="#FFFFFF" stroke="#D5CFC2"/>
  <text x="916" y="374" class="t">Turnstile</text>
  <text x="1154" y="374" class="s" text-anchor="end">bot check</text>
  <rect x="900" y="440" width="270" height="110" rx="10" fill="#FFFFFF" stroke="#D5CFC2"/>
  <text x="916" y="466" class="t">Neon Postgres 18</text>
  <text x="916" y="490" class="s">users, drafts, chats,</text>
  <text x="916" y="510" class="s">AI usage, exports</text>
  <text x="916" y="530" class="s">scales to zero</text>
  <path d="M230 296 H316" fill="none" stroke="#2743C4" stroke-width="1.6" marker-end="url(#blue)"/>
  <text x="273" y="288" class="l" text-anchor="middle" fill="#2743C4">HTTPS</text>
  <path d="M470 280 H515 V230 H556" fill="none" stroke="#2743C4" stroke-width="1.6" marker-end="url(#blue)"/>
  <text x="508" y="252" class="l" text-anchor="end" fill="#2743C4">/api/*</text>
  <path d="M470 312 H515 V461 H556" fill="none" stroke="#6A665D" stroke-width="1.6" marker-end="url(#grey)"/>
  <text x="508" y="395" class="l" text-anchor="end" fill="#6A665D">pages</text>
  <path d="M680 420 V404" fill="none" stroke="#6A665D" stroke-width="1.6" marker-end="url(#grey)"/>
  <text x="690" y="414" class="l" fill="#6A665D">calls</text>
  <path d="M800 89 H896" fill="none" stroke="#2743C4" stroke-width="1.6" marker-end="url(#blue)"/>
  <text x="848" y="81" class="l" text-anchor="middle" fill="#2743C4">stream + tools</text>
  <path d="M800 161 H896" fill="none" stroke="#6A665D" stroke-width="1.6" marker-end="url(#grey)"/>
  <text x="848" y="153" class="l" text-anchor="middle" fill="#6A665D">print HTML</text>
  <path d="M800 233 H896" fill="none" stroke="#6A665D" stroke-width="1.6" marker-end="url(#grey)"/>
  <text x="848" y="225" class="l" text-anchor="middle" fill="#6A665D">send</text>
  <path d="M800 299 H896" fill="none" stroke="#6A665D" stroke-width="1.6" marker-end="url(#grey)"/>
  <text x="848" y="291" class="l" text-anchor="middle" fill="#6A665D">checkout</text>
  <path d="M900 319 H804" fill="none" stroke="#6A665D" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#grey)"/>
  <text x="848" y="333" class="l" text-anchor="middle" fill="#6A665D">webhook</text>
  <path d="M800 377 H896" fill="none" stroke="#6A665D" stroke-width="1.6" marker-end="url(#grey)"/>
  <text x="848" y="369" class="l" text-anchor="middle" fill="#6A665D">siteverify</text>
  <path d="M800 390 H850 V478 H896" fill="none" stroke="#2743C4" stroke-width="1.6" marker-end="url(#blue)"/>
  <text x="858" y="470" class="l" text-anchor="start" fill="#2743C4">SQL</text>
  <path d="M800 557 H850 V522 H896" fill="none" stroke="#6A665D" stroke-width="1.6" marker-end="url(#grey)"/>
  <text x="858" y="545" class="l" text-anchor="start" fill="#6A665D">purge</text>
  <path d="M316 326 H230" fill="none" stroke="#2743C4" stroke-width="1.6" marker-end="url(#blue)"/>
  <text x="273" y="343" class="l" text-anchor="middle" fill="#2743C4">SSE stream</text>
  <path d="M30 560 H70" stroke="#2743C4" stroke-width="1.6"/>
  <text x="80" y="564" class="s">one chat turn</text>
  <path d="M30 586 H70" stroke="#6A665D" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="80" y="590" class="s">calls in</text>
</svg>
