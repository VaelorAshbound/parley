# Nightly (spec §6 "When tests run", T33): the slow and paid checks that
# don't run on every PR, then one report with the link to this run, emailed
# to the owner.
# - evals: ~36 real conversations across all 12 documents with the real
#   model (the capped OpenRouter test key).
# - export: all 12 documents printed by real Browser Run and built as Word,
#   read back word for word and compared with the approved PDF baselines
#   (T31), plus the real PDF/DOCX in workerd.
# - mutation (T34) and performance + load (T35): their own scripts.
# - production: the real Turnstile keys and the smoke test on the live
#   site. Skipped until production exists (NIGHTLY_URL, T38).
# The fast e2e suite has its own nightly run (e2e.yml).
name: Nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  # The label "nightly" on a PR runs it now: GitHub only starts scheduled and
  # manual runs from main, and PR #1 stays open until launch.
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  start:
    # The test key's spend before the run: the report shows the difference.
    # Every other job waits for this one, so a different label stops them all.
    if: github.event_name != 'pull_request' || github.event.label.name == 'nightly'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      usage: ${{ steps.usage.outputs.usage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - id: usage
        env:
          OPENROUTER_API_KEY_TEST: ${{ secrets.OPENROUTER_API_KEY_TEST }}
        run: echo "usage=$(node scripts/nightly-report.ts usage)" >> "$GITHUB_OUTPUT"

  evals:
    needs: start
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # Scripts on: the evals run a real Postgres (embedded-postgres).
      - run: pnpm install --frozen-lockfile
      - run: pnpm documents:build
      - name: Evals (real model)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_TEST }}
        run: pnpm evals
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evals-report
          path: evals/report.md
          retention-days: 30
          if-no-files-found: ignore

  export:
    needs: start
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Playwright's image: the PDF pages are drawn in its Chromium.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host --init
    env:
      # Browser Run through wrangler's remote bindings (the owner's account).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # Scripts on: wrangler's workerd.
      - run: pnpm install --frozen-lockfile
      - run: pnpm documents:build
      - name: All 12 documents, printed and read back
        run: pnpm test:real:export
      # No RESEND_API_KEY here: its email tests skip (the PR run sends one).
      - name: Real PDF and DOCX in workerd
        run: pnpm test:workers:real
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: export-${{ github.run_id }}
          path: apps/web/test/real/output/
          retention-days: 7
          if-no-files-found: ignore

  mutation:
    needs: start
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm documents:build
      # T34's Stryker run (packages/documents, quota, auth).
      - run: pnpm test:mutation

  performance:
    needs: start
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Lighthouse and the k6 burst target the PR #1 Preview until
      # production exists; T35 owns what runs here.
      PREVIEW_URL: ${{ vars.PERF_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm documents:build
      # T35: Lighthouse budgets and the k6 load test (load/chat.k6.js).
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - run: pnpm test:perf

  production:
    needs: start
    # Until production exists (T38) there is no live site to check.
    if: vars.NIGHTLY_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host --init
    env:
      PREVIEW_URL: ${{ vars.NIGHTLY_URL }}
      # Production has the real Turnstile keys: a made-up token must fail.
      TURNSTILE_REAL_KEYS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm documents:build
      - name: Real Turnstile and the smoke test on the live site
        working-directory: apps/web
        run: pnpm exec playwright test -c playwright.real.config.ts turnstile.real.ts smoke.prod.spec.ts

  report:
    needs: [start, evals, export, mutation, performance, production]
    # Also after a failed job, but not when the run didn't start (another label).
    if: always() && needs.start.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: evals-report
          path: nightly
      - name: Report, and email its link
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          USAGE_BEFORE: ${{ needs.start.outputs.usage }}
          EVALS_REPORT: nightly/report.md
          OPENROUTER_API_KEY_TEST: ${{ secrets.OPENROUTER_API_KEY_TEST }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ vars.REPORT_EMAIL }}
        run: node scripts/nightly-report.ts send
