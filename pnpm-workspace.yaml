packages:
  - "apps/*"
  - "packages/*"
  - "evals"

allowBuilds:
  "@embedded-postgres/linux-x64": true
  esbuild: true
  lightningcss: true
  sharp: true
  unrs-resolver: true
  workerd: true
  msw: false

catalog:
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0

overrides:
  vite@*: "catalog:"
  # One Node type version (engines: node 24). Two versions gave two copies of
  # vite-plus, and the root build then used a different Vite than the
  # Cloudflare plugin, which broke the Worker bundle (T14).
  "@types/node": ^24.13.6

# Stryker 10 names tests the way Vitest 4 matched them; Vitest 5 joins the
# names with " > ", and without this every mutant ran no test (T34, PAR-26).
patchedDependencies:
  "@stryker-mutator/vitest-runner@10.0.0": patches/@stryker-mutator__vitest-runner@10.0.0.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
