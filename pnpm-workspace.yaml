packages:
  - "apps/*"
  - "packages/*"
  - "evals"

allowBuilds:
  "@embedded-postgres/linux-x64": true
  esbuild: true
  lightningcss: true
  sharp: true
  unrs-resolver: true
  workerd: true
  msw: false

catalog:
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0

overrides:
  vite@*: "catalog:"
  # One Node type version (engines: node 24). Two versions gave two copies of
  # vite-plus, and the root build then used a different Vite than the
  # Cloudflare plugin, which broke the Worker bundle (T14).
  "@types/node": ^24.13.6
  # Dev-only advisories (PAR-53); none of these reach the Worker bundle.
  # Miniflare (wrangler, the Vite and Vitest plugins) pins undici 7.29.0.
  "undici@>=7.0.0 <7.29.1": ^7.29.1
  # @lhci/cli 0.15.1 (the latest) and its inquirer want tmp 0.1 and 0.0.33.
  "tmp@<0.2.6": ^0.2.6
  # drizzle-kit's TypeScript loader pins esbuild 0.18.
  "@esbuild-kit/core-utils>esbuild": ^0.25.0

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
